name: IG test (dry-run, nic neodesle)

# Ruční test IG scrapingu: přihlásí se přes IG_USER/IG_PASS, projede IG_ACCOUNTS
# a vypíše, kolik akcí vytáhl. NEcommituje, NEposílá maily (fetch_instagram dry_run=True).
on:
  workflow_dispatch: {}

jobs:
  ig-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Zkusit IG
        env:
          IG_USER: ${{ secrets.IG_USER }}
          IG_PASS: ${{ secrets.IG_PASS }}
        run: |
          python - <<'PY'
          import datetime, grab_underground as gu
          print("IG_USER nastaven:", bool(__import__("os").environ.get("IG_USER")))
          print("uctu ke kontrole:", len(gu.IG_ACCOUNTS))
          today = datetime.date.today()
          evs = gu.fetch_instagram(today, dry_run=True)
          print("\n=== IG VYSLEDEK ===")
          print("akci z IG celkem:", len(evs))
          for e in sorted(evs, key=lambda x: x["date"])[:40]:
              print(f"  {e['date']} {e['time']}  {e['venue']:12s} {'/'.join(e['genres']):12s} {e['title'][:50]}")
          PY
